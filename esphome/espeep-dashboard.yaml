# ESPeep — device file for the ESPHome dashboard (Home Assistant add-on).
#
# In the dashboard: "+ New device", give it a name, pick ESP32, and let it
# create the file. Then open "Edit" and replace everything BELOW the api /
# ota / wifi blocks the dashboard generated with the `substitutions` and
# `packages` sections from this file. Keep the generated api key, OTA
# password and WiFi settings — they are yours.
#
# The packages come straight from GitHub; "Install" fetches them. Only list
# the substitutions you need to change: every package ships sensible defaults
# (GM60 scanner on GPIO16/17 at 57600 baud, OLED on GPIO21/22, buzzer on
# GPIO25). The full list with explanations is in espeep.yaml.

substitutions:
  # Must match `name:` below / the name the dashboard created.
  device_name: espeep
  friendly_name: ESPeep
  # GM65 / GM66 / GM67 / GM77: 9600. GM60: 57600.
  scanner_baud: "57600"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

# --- generated by the dashboard, keep yours ---------------------------------
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password

captive_portal:
# ----------------------------------------------------------------------------

packages:
  espeep:
    url: https://github.com/mrclksr2409/ESPeep
    ref: main
    refresh: 1d
    files:
      - esphome/packages/base.yaml
      - esphome/packages/scanner.yaml
      - esphome/packages/display.yaml
      - esphome/packages/feedback.yaml
