# ESPeep — device file for the ESPHome command line, using this checkout.
#
# Using the ESPHome dashboard (Home Assistant add-on) instead? Use
# espeep-dashboard.yaml — it pulls the packages straight from GitHub, so you
# do not need a copy of this repository at all.
#
#   1. cp secrets.yaml.example secrets.yaml   and fill it in
#   2. adjust the substitutions to your board and wiring
#   3. esphome run espeep.yaml
#
# Wiring and part list: ../docs/hardware.md
# Getting a scanner into UART mode: ../docs/scanner-modules.md
#
# Everything the device does with a barcode after reading it — lookup, your
# own names, the shopping list — happens in the ESPeep Home Assistant
# integration, not here.

substitutions:
  device_name: espeep
  friendly_name: ESPeep

  # --- board ---------------------------------------------------------------
  # "esp32dev" covers the common DevKitC / NodeMCU-32S boards. For a
  # D1 Mini ESP32 use "wemos_d1_mini32".
  esp32_board: esp32dev
  log_level: INFO
  # Onboard LED of most ESP32 dev boards. Set to "true" if yours is active low.
  status_led_pin: GPIO2
  status_led_inverted: "false"

  # --- barcode scanner (UART) ----------------------------------------------
  # rx_pin goes to the scanner's TX line and vice versa.
  # UART2 on the ESP32; leaves UART0 free for the USB log.
  scanner_rx_pin: GPIO16
  scanner_tx_pin: GPIO17
  # Factory default of the GM60: 57600 8N1.
  # GM65 / GM66 / GM67 / GM77 use 9600 instead — see
  # ../docs/scanner-modules.md for the full table.
  scanner_baud: "57600"
  # Ignore the same barcode if it is read again within this many milliseconds.
  rescan_guard_ms: "3000"

  # --- OLED (I2C) ----------------------------------------------------------
  i2c_sda: GPIO21
  i2c_scl: GPIO22
  # 0x3C on almost every 0.96" module; the i2c scan at boot logs the truth.
  oled_address: "0x3C"
  # How long a result stays on screen before returning to the idle screen.
  result_hold_ms: "6000"

  # --- buzzer --------------------------------------------------------------
  # Must be a passive piezo buzzer, not an active one.
  buzzer_pin: GPIO25

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP so the device stays reachable if the WiFi credentials are wrong.
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password

captive_portal:

packages:
  base: !include packages/base.yaml
  scanner: !include packages/scanner.yaml
  display: !include packages/display.yaml
  feedback: !include packages/feedback.yaml
