# ESPeep — base device configuration.
#
# Owns everything that is not specific to scanning: board, connectivity,
# logging and OTA — plus the small UI state machine that `display.yaml`
# renders and `feedback.yaml` turns into sounds.
#
# All tunables come from the substitutions in ../espeep.yaml.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "EAN scanner feeding the Home Assistant shopping list"

esp32:
  board: ${esp32_board}
  framework:
    # esp-idf ships Mozilla's root CA bundle, which is what lets the
    # Open Food Facts lookup in lookup.yaml run with verify_ssl: true.
    type: esp-idf

logger:
  level: ${log_level}

api:
  id: ha_api
  encryption:
    key: !secret api_encryption_key
  actions:
    # Home Assistant calls this back after it has applied the EAN mapping
    # table, so the display ends up showing the name that actually landed on
    # the shopping list — not just what Open Food Facts returned.
    # Exposed to HA as the action `esphome.${device_name}_show_result`.
    - action: show_result
      variables:
        status: string
        title: string
        detail: string
      then:
        - lambda: |-
            id(ui_set)->execute(status, title, detail);

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP so the device stays reachable if the WiFi credentials are wrong.
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_password

captive_portal:

status_led:
  pin:
    number: ${status_led_pin}
    inverted: ${status_led_inverted}


# --- Shared UI state -------------------------------------------------------
#
# Every package reports what happened by calling the `ui_set` script instead
# of touching the display or the buzzer directly. That keeps the scan and
# lookup logic free of presentation details and gives us exactly one place
# where a new state has to be handled.
#
# States: "idle" | "read" | "busy" | "ok" | "unknown" | "error"

globals:
  - id: ui_state
    type: std::string
    restore_value: false
    initial_value: '"idle"'

  # Headline on the display — product name, "Unbekannt", or an error title.
  - id: ui_title
    type: std::string
    restore_value: false
    initial_value: '""'

  # Second line — usually the barcode or a hint about what went wrong.
  - id: ui_detail
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: ui_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

script:
  - id: ui_set
    parameters:
      state: string
      title: string
      detail: string
    then:
      - lambda: |-
          id(ui_state) = state;
          id(ui_title) = title;
          id(ui_detail) = detail;
          id(ui_since) = millis();
          ESP_LOGD("espeep", "ui=%s title='%s' detail='%s'",
                   state.c_str(), title.c_str(), detail.c_str());
      - script.execute: ui_feedback

interval:
  # Return to the idle screen once a result has been on display long enough.
  - interval: 500ms
    then:
      - lambda: |-
          if (id(ui_state) != "idle" && id(ui_state) != "busy" &&
              millis() - id(ui_since) > ${result_hold_ms}) {
            id(ui_state) = "idle";
            id(ui_title) = "";
            id(ui_detail) = "";
          }
