# ESPeep — base device configuration.
#
# Owns everything that is not specific to scanning: board, logging, the API
# action Home Assistant answers through, plus the small UI state machine that
# `display.yaml` renders and `feedback.yaml` turns into sounds.
#
# WiFi, API key and OTA password are deliberately NOT in here: they belong to
# your own device file (espeep.yaml, or the one the ESPHome dashboard created),
# so this package can be pulled straight from GitHub.
#
# The substitutions below are defaults. Override any of them in your device
# file — its substitutions win over the ones from packages.

substitutions:
  device_name: espeep
  friendly_name: ESPeep
  esp32_board: esp32dev
  log_level: INFO
  status_led_pin: GPIO2
  status_led_inverted: "false"
  result_hold_ms: "6000"
  # How long to wait for Home Assistant's answer before showing an error.
  ha_timeout_ms: "15000"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "EAN scanner feeding the Home Assistant shopping list"
  # Lets the ESPeep integration recognise the device: Home Assistant shows
  # it as manufacturer "mrclksr2409", model "espeep".
  project:
    name: mrclksr2409.espeep
    version: "2.0.0"

esp32:
  board: ${esp32_board}
  framework:
    type: esp-idf

logger:
  level: ${log_level}

api:
  id: ha_api
  actions:
    # The ESPeep integration calls this with the outcome of every scan: the
    # name that landed on the list, "unknown", or an error.
    # Exposed to HA as the action `esphome.${device_name}_show_result`.
    - action: show_result
      variables:
        status: string
        title: string
        detail: string
      then:
        - lambda: |-
            id(ui_set)->execute(status, title, detail);

status_led:
  pin:
    number: ${status_led_pin}
    inverted: ${status_led_inverted}


# --- Shared UI state -------------------------------------------------------
#
# Every package reports what happened by calling the `ui_set` script instead
# of touching the display or the buzzer directly. That keeps the scan logic
# free of presentation details and gives us exactly one place
# where a new state has to be handled.
#
# States: "idle" | "read" | "ok" | "unknown" | "error"
#   read = barcode accepted and sent, waiting for Home Assistant

globals:
  - id: ui_state
    type: std::string
    restore_value: false
    initial_value: '"idle"'

  # Headline on the display — product name, "Unbekannt", or an error title.
  - id: ui_title
    type: std::string
    restore_value: false
    initial_value: '""'

  # Second line — usually the barcode or a hint about what went wrong.
  - id: ui_detail
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: ui_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

script:
  - id: ui_set
    parameters:
      state: string
      title: string
      detail: string
    then:
      - lambda: |-
          id(ui_state) = state;
          id(ui_title) = title;
          id(ui_detail) = detail;
          id(ui_since) = millis();
          ESP_LOGD("espeep", "ui=%s title='%s' detail='%s'",
                   state.c_str(), title.c_str(), detail.c_str());
      - script.execute: ui_feedback

interval:
  - interval: 500ms
    then:
      - lambda: |-
          // Home Assistant never answered: integration not set up, HA
          // restarting, or the device not adopted.
          if (id(ui_state) == "read" && millis() - id(ui_since) > ${ha_timeout_ms}) {
            id(ui_set)->execute("error", "Keine Antwort von HA", id(current_ean));
            return;
          }
          // Return to the idle screen once a result has been on display long enough.
          if (id(ui_state) != "idle" && id(ui_state) != "read" &&
              millis() - id(ui_since) > ${result_hold_ms}) {
            id(ui_state) = "idle";
            id(ui_title) = "";
            id(ui_detail) = "";
          }
