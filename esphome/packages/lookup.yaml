# ESPeep — barcode to product name lookup against Open Food Facts.
#
# The lookup runs on the device so the product name appears on the OLED
# immediately, without a round trip through Home Assistant.
#
# The `?fields=` filter is what makes this viable on an ESP32: the unfiltered
# Open Food Facts response for a product is well over 100 kB, the filtered one
# is a few hundred bytes and fits comfortably in the response buffer.
#
# Home Assistant still gets the final say — see homeassistant/packages/espeep.yaml.
# Its EAN mapping table overrides whatever is found here, and it answers back
# through the `show_result` API action defined in base.yaml.

http_request:
  id: http_client
  # Open Food Facts asks API clients to identify themselves and throttles
  # generic user agents.
  useragent: ${off_user_agent}
  # The esp-idf framework selected in base.yaml provides the root CA bundle
  # this needs.
  verify_ssl: true
  timeout: ${lookup_timeout}

globals:
  - id: product_name
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: product_brand
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: product_quantity
    type: std::string
    restore_value: false
    initial_value: '""'

  # "off" when Open Food Facts knew the product, "none" when it did not.
  - id: lookup_source
    type: std::string
    restore_value: false
    initial_value: '"none"'

script:
  - id: lookup_product
    # A new scan supersedes a lookup that is still in flight.
    mode: restart
    then:
      - lambda: |-
          id(product_name) = "";
          id(product_brand) = "";
          id(product_quantity) = "";
          id(lookup_source) = "none";
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - lambda: |-
                id(ui_set)->execute("error", "Kein WLAN", id(current_ean));
          else:
            - lambda: |-
                id(ui_set)->execute("busy", "Suche Produkt", id(current_ean));
            - http_request.get:
                url: !lambda |-
                  return "https://world.openfoodfacts.org/api/v2/product/" +
                         id(current_ean) +
                         ".json?fields=product_name,product_name_de,brands,quantity";
                capture_response: true
                max_response_buffer_size: 4096
                on_response:
                  then:
                    - lambda: |-
                        int status = (int) response->status_code;
                        bool server_error = false;

                        // 404 is Open Food Facts' answer for "no such product",
                        // which is a normal outcome here, not a failure.
                        if (status == 404) {
                          ESP_LOGI("espeep", "%s is not in Open Food Facts",
                                   id(current_ean).c_str());
                        } else if (status != 200) {
                          ESP_LOGW("espeep", "Open Food Facts returned HTTP %d", status);
                          server_error = true;
                        } else {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            JsonObject product = root["product"].as<JsonObject>();
                            if (product.isNull())
                              return false;

                            // Prefer the German name, fall back to the
                            // language-neutral one.
                            const char *name = product["product_name_de"].as<const char *>();
                            if (name == nullptr || name[0] == '\0')
                              name = product["product_name"].as<const char *>();
                            if (name == nullptr || name[0] == '\0')
                              return false;

                            id(product_name) = name;

                            const char *brand = product["brands"].as<const char *>();
                            if (brand != nullptr)
                              id(product_brand) = brand;

                            const char *quantity = product["quantity"].as<const char *>();
                            if (quantity != nullptr)
                              id(product_quantity) = quantity;

                            id(lookup_source) = "off";
                            return true;
                          });
                        }

                        if (server_error) {
                          // Reported to Home Assistant regardless: the mapping
                          // table there may well know this barcode.
                          id(ui_set)->execute("error", "Server-Fehler",
                                              "HTTP " + std::to_string(status));
                        } else if (id(lookup_source) == "off") {
                          // Open Food Facts lists brands comma separated;
                          // only the first one is useful on a shopping list.
                          std::string brand = id(product_brand);
                          size_t comma = brand.find(',');
                          if (comma != std::string::npos)
                            brand = brand.substr(0, comma);

                          std::string label = id(product_name);
                          if (!brand.empty() && label.find(brand) == std::string::npos)
                            label = brand + " " + label;

                          id(product_brand) = brand;
                          id(product_name) = label;
                          id(ui_set)->execute("ok", label, id(current_ean));
                        } else {
                          id(ui_set)->execute("unknown", "Unbekannt", id(current_ean));
                        }
                    - script.execute: report_scan
                on_error:
                  then:
                    - lambda: |-
                        ESP_LOGW("espeep", "Lookup for %s failed to reach Open Food Facts",
                                 id(current_ean).c_str());
                        id(ui_set)->execute("error", "Keine Verbindung", id(current_ean));
                    # Home Assistant can still resolve this from its own mapping
                    # table, so report the scan even when the lookup failed.
                    - script.execute: report_scan

  # Hand the result to Home Assistant. It applies the EAN mapping table, adds
  # the item to the shopping list and calls `show_result` back on this device.
  - id: report_scan
    then:
      - homeassistant.event:
          event: esphome.espeep_scan
          variables:
            v_ean: |-
              return id(current_ean);
            v_name: |-
              return id(product_name);
            v_brand: |-
              return id(product_brand);
            v_quantity: |-
              return id(product_quantity);
            v_source: |-
              return id(lookup_source);
          data_template:
            ean: "{{ v_ean }}"
            name: "{{ v_name }}"
            brand: "{{ v_brand }}"
            quantity: "{{ v_quantity }}"
            source: "{{ v_source }}"
