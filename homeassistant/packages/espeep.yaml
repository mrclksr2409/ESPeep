# ESPeep — Home Assistant side of the barcode scanner.
#
# Install: see ../../docs/home-assistant.md. In short, copy this file and
# ean_mapping.yaml into config/packages/ and add to configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# ─────────────────────────────────────────────────────────────────────────────
#  ADJUST THESE THREE VALUES — they are each defined in exactly one place below
# ─────────────────────────────────────────────────────────────────────────────
#   1. script.espeep_add_item      -> list_entity     (your to-do list)
#   2. script.espeep_ask_for_name  -> notify_service  (your phone)
#   3. script.espeep_show_result   -> device_action   (only if you renamed the
#                                                      device in espeep.yaml)
# ─────────────────────────────────────────────────────────────────────────────
#
# What happens on a scan:
#
#   device fires esphome.espeep_scan
#     -> your ean_mapping.yaml wins if it has the barcode
#     -> otherwise the name the device got from Open Food Facts
#     -> otherwise: push notification asking you to name it, and the answer
#        is written back into ean_mapping.yaml so it is known from then on
#   -> item added to the to-do list, result pushed back to the device display


# The mapping table is loaded as a sensor attribute. A Template Helper created
# through the UI would be the usual choice, but its config flow has no field
# for `attributes:`, so this is one of the cases where template YAML is the
# only way. `template.reload` picks up changes to ean_mapping.yaml.
template:
  - sensor:
      - name: "ESPeep EAN Mapping"
        unique_id: espeep_ean_mapping
        icon: mdi:barcode-scan
        # The sensor exists solely to carry the `map` attribute; its state is
        # not meaningful.
        state: "loaded"
        attributes:
          map: !include ean_mapping.yaml


shell_command:
  # Values are passed as arguments, not interpolated into a shell string.
  # The automation below strips everything outside a safe character set first,
  # and the script itself refuses anything that still looks wrong.
  espeep_remember_ean: >-
    bash /config/espeep_remember_ean.sh
    /config/packages/ean_mapping.yaml
    "{{ ean }}"
    "{{ name }}"


script:
  espeep_add_item:
    alias: "ESPeep: Artikel auf die Liste setzen"
    description: >-
      Adds an item to the shopping list unless it is already on it, and reports
      back which of the two happened.
    mode: queued
    max: 10
    fields:
      item:
        description: "Product name to put on the list"
        example: "Milch"
        required: true
        selector:
          text:
      ean:
        description: "Barcode, stored on the item for traceability"
        example: "4008400202037"
        required: true
        selector:
          text:
    variables:
      # >>> YOUR SHOPPING LIST GOES HERE <<<
      list_entity: todo.einkaufsliste
    sequence:
      - action: todo.get_items
        target:
          entity_id: "{{ list_entity }}"
        data:
          status: needs_action
        response_variable: todo_items
        note: >-
          Scanning the same product twice on two different days should not put
          it on the list twice.
      - variables:
          existing: >-
            {{ (todo_items[list_entity]['items'] | default([], true))
               | map(attribute='summary') | map('lower') | list }}
      - if:
          - "{{ item | lower | trim in existing }}"
        then:
          - variables:
              result:
                added: false
          - stop: "Already on the list"
            response_variable: result
      - action: todo.add_item
        target:
          entity_id: "{{ list_entity }}"
        data:
          item: "{{ item }}"
          description: "EAN {{ ean }}"
      - variables:
          result:
            added: true
      - stop: "Added"
        response_variable: result

  espeep_ask_for_name:
    alias: "ESPeep: nach dem Namen eines unbekannten Artikels fragen"
    description: >-
      Sends a notification with a text input field. The barcode travels in the
      action name, because that is the only field the companion app reliably
      sends back with the reply.
    mode: queued
    max: 10
    fields:
      ean:
        description: "The barcode nobody could resolve"
        example: "4008400202037"
        required: true
        selector:
          text:
    variables:
      # >>> YOUR PHONE GOES HERE <<<
      notify_service: notify.mobile_app_dein_handy
    sequence:
      - action: "{{ notify_service }}"
        data:
          title: "ESPeep: unbekannter Artikel"
          message: "Barcode {{ ean }} steht in keiner Datenbank. Wie soll er auf der Einkaufsliste heißen?"
          data:
            actions:
              - action: "ESPEEP_NAME_{{ ean }}"
                title: "Namen eingeben"
                behavior: textInput
                textInputButtonTitle: "Speichern"
                textInputPlaceholder: "z. B. Milch"

  espeep_show_result:
    alias: "ESPeep: Ergebnis auf dem Display anzeigen"
    description: >-
      Pushes the final wording back to the OLED, so the display shows the name
      that actually landed on the list — which for a mapped barcode is not the
      name Open Food Facts returned.
    mode: queued
    max: 10
    fields:
      status:
        description: "ok | unknown | error"
        example: "ok"
        required: true
        selector:
          select:
            options: ["ok", "unknown", "error"]
      title:
        description: "Headline on the display"
        example: "Milch"
        required: true
        selector:
          text:
      detail:
        description: "Second line on the display"
        example: "Auf der Liste"
        required: true
        selector:
          text:
    sequence:
      # >>> ONLY CHANGE THIS IF YOU RENAMED device_name IN espeep.yaml <<<
      - action: esphome.espeep_show_result
        data:
          status: "{{ status }}"
          title: "{{ title }}"
          detail: "{{ detail }}"
        # The device may be offline (unplugged, rebooting). That must not abort
        # the run — the item is already on the list, which is what matters.
        continue_on_error: true


automation:
  - id: espeep_handle_scan
    alias: "ESPeep – Scan verarbeiten"
    description: >-
      Resolves a scanned barcode to a shopping list entry. Your own mapping
      table beats Open Food Facts; if neither knows the product, ESPeep asks
      you for a name.
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: esphome.espeep_scan
    conditions:
      - "{{ trigger.event.data.ean | default('') is match('^[0-9]{8,14}$') }}"
    variables:
      ean: "{{ trigger.event.data.ean }}"
      off_name: "{{ trigger.event.data.name | default('', true) | trim }}"
      mapped: >-
        {{ (state_attr('sensor.espeep_ean_mapping', 'map') or {})
           .get(ean, '') | trim }}
      final_name: "{{ mapped if mapped else off_name }}"
    actions:
      - if:
          - "{{ final_name != '' }}"
        then:
          - action: script.espeep_add_item
            data:
              item: "{{ final_name }}"
              ean: "{{ ean }}"
            response_variable: add_result
          - action: script.espeep_show_result
            data:
              status: ok
              title: "{{ final_name }}"
              detail: "{{ 'Auf der Liste' if add_result.added else 'Schon drauf' }}"
        else:
          - action: script.espeep_ask_for_name
            data:
              ean: "{{ ean }}"
          - action: script.espeep_show_result
            data:
              status: unknown
              title: "Unbekannt"
              detail: "Frage aufs Handy"

  - id: espeep_learn_name
    alias: "ESPeep – Namen für unbekannten Barcode lernen"
    description: >-
      Handles the reply to the "unknown product" notification: stores the name
      in ean_mapping.yaml so the barcode resolves instantly next time, then
      puts the item on the list.
    mode: queued
    max: 10
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - "{{ trigger.event.data.action | default('') is match('^ESPEEP_NAME_[0-9]{8,14}$') }}"
    variables:
      ean: "{{ trigger.event.data.action | replace('ESPEEP_NAME_', '') }}"
      # The reply is free text on its way to a shell command and to a YAML
      # file. Restricting it to a known-good character set here is the first
      # of the two defences; espeep_remember_ean.sh is the second.
      safe_name: >-
        {{ trigger.event.data.reply_text | default('', true)
           | regex_replace('[^0-9A-Za-zÄÖÜäöüß .,%&+/-]', '')
           | trim }}
    actions:
      - condition: "{{ safe_name != '' }}"
        note: "An empty or entirely stripped reply means there is nothing to learn."
      - action: shell_command.espeep_remember_ean
        data:
          ean: "{{ ean }}"
          name: "{{ safe_name }}"
        response_variable: remember
      - if:
          - "{{ remember.returncode != 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: "ESPeep konnte den Namen nicht speichern"
              message: >-
                `{{ ean }}` -> `{{ safe_name }}` wurde nicht in
                ean_mapping.yaml geschrieben (Exit-Code
                {{ remember.returncode }}): {{ remember.stderr }}
          - stop: "Could not write the mapping file"
      - action: template.reload
        note: "Makes the new entry visible to sensor.espeep_ean_mapping."
      - action: script.espeep_add_item
        data:
          item: "{{ safe_name }}"
          ean: "{{ ean }}"
        response_variable: add_result
      - action: script.espeep_show_result
        data:
          status: ok
          title: "{{ safe_name }}"
          detail: "{{ 'Gemerkt + auf der Liste' if add_result.added else 'Gemerkt' }}"
