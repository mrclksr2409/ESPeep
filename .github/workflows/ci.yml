name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  integration-tests:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt ruff
          # The integration depends on `frontend` (for its panel), which needs
          # the frontend package in exactly the version this core pins.
          pip install "$(python - <<'PY'
          import json, pathlib
          import homeassistant.components.frontend as frontend
          manifest = pathlib.Path(frontend.__file__).parent / "manifest.json"
          print(json.loads(manifest.read_text())["requirements"][0])
          PY
          )"

      - name: Lint
        run: |
          ruff check custom_components tests/ha
          ruff format --check custom_components tests/ha

      - name: Run tests
        run: pytest -p no:sugar tests/ha

  panel:
    name: Panel script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check custom_components/espeep/frontend/espeep-panel.js

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand images live in home-assistant/brands and are added after
          # the first release.
          ignore: brands

  logic-tests:
    name: Barcode and display logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run the logic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -o test_logic tests/test_logic.cpp
          ./test_logic

  esphome:
    name: ESPHome config and firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      # The real secrets never leave your machine; CI only needs values that
      # satisfy the schema so the config can be validated and compiled.
      - name: Provide placeholder secrets
        working-directory: esphome
        run: |
          cp secrets.yaml.example secrets.yaml
          sed -i "s|REPLACE_ME_WITH_A_BASE64_32_BYTE_KEY|$(openssl rand -base64 32)|" secrets.yaml

      - name: Validate configuration
        working-directory: esphome
        run: esphome config espeep.yaml

      # The dashboard variant pulls the packages from GitHub. Point it at the
      # branch under test so it validates this change, not main.
      - name: Validate dashboard configuration
        working-directory: esphome
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          sed "s|ref: main|ref: ${BRANCH}|" espeep-dashboard.yaml > espeep-dashboard-ci.yaml
          esphome config espeep-dashboard-ci.yaml

      # Catches C++ errors in the lambdas that `esphome config` cannot see.
      - name: Compile firmware
        working-directory: esphome
        run: esphome compile espeep.yaml
